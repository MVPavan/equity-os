  notation: {value: 'v exact decimal or p/q; iv [lo, hi]. A figure''s v is its XBRL lex / UNIT_SCALE[u] (INR 10^7 = crore, INRPerShare 1), iv half-width 10^-d / 2 in the same unit (INF: 0); no locator carries sign. A derived node is {expr, v}: expr over the bound operands'' v re-evaluates to v exactly; pct and calc.3 are emitted as v quantized to 0.01 ROUND_HALF_EVEN', xbrl_locator: 'src, c (concept local name), ctx (contextRef), u (unitRef), d (decimals), lex, per (effective period after the DateOfStart/End re-periodisation); no dims = an undimensioned context', pdf_locator: 'src, pg, label (as printed in the text layer), col (a column id of header.pdf_columns[src][pg]), lex. Binding as stage1 header.notation.pdf_locator: label instance = a word equal to its first token with every token among the words to its right within 7pt; the cell is the words within 5pt of that y inside the column''s x band and must equal [lex]; a band is bound to its header by the words inside it on header_y. Printed lexemes drop grouping commas, read (x) as negative; a lone ''-'' or ''.'' is a zero marker read as exact 0. The unit is crore', field_locator: 'src, path (dotted JSON/YAML path), lex (the value as text)', claims: 'quarters[Q].claims = the run''s 46 numerical claim keys (fact.<role>, cmp.<role>.<qoq|yoy>.<prior|abs|pct>, calc.1..calc.4); aux holds the share of associates operand. calc.2 pdf_parts are the tax component cells (current, deferred, earlier years) whose sum corroborates it', package: 'quarters[Q].package: the five input members {xbrl, results_pdf, transcript_pdf, qoq, yoy}: config source_id, retrieval-manifest entry (quarter, kind) and sha256', approval: 'header.approval.payload_sha256 = sha256 of this file''s bytes with the one line starting ''  approval:'' (and its newline) removed'}
