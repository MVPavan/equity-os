# Stage 3 frozen manifest (plan D8 Task 7). Generated by a scratchpad authoring aid from retained bytes; vendor readings live only in the private companion (header.companion).
header:
  manifest: stage3
  spec: docs/specs/2026-10-11-canonical-financial-data-and-cross-source-comparison.md (Stage 3; §1, §4,
    §5, §7); plan docs/workstreams/data-foundation/plans/D8.md (Task 7 incl. its 2026-10-21 amendment;
    R1-R12; Owner amendment 2026-10-20)
  hand_verification: {verifier: claude-opus-5-5 (D8 Task 7 author), date: '2026-10-21', method: 'Authored
      under plan D8 R9: a scratchpad aid (no fundamentals import) read only the retained gen-2 bytes (lxml
      for the SHP XBRL and the Screener and Tijori pages, json for the listing, drill-downs and Upstox,
      pymupdf for the SEBI format) through tests/fundamentals/manifest_locators.py and stage3_data_support.py,
      and ran no D8 code and no run output. Round 1 rulings were the author''s own; fix round 1 (Sol task7-r1)
      aligned ids, members and node rulings to Sol''s R9 divergence rulings and the shipped dictionary
      v3 and mapping set v7 entries, and states, pairs and routes to the shipped source-state, calculation-state,
      corroboration, vendor-side and routing contracts (read statically, not run). Values are verbatim
      lexemes; point-check sums are exact Fraction arithmetic recorded as expressions. Spot checks by
      hand (fix round 1): APARINDS direct, VOTING_RIGHTS, subcategory, derived and scalar rows, and its
      keyless group totals against Sol r1''s independent APARINDS counts (Screener 120 + 116, Upstox 5
      + 2); row totals 20/22/27 against Sol''s traced totals.'}
  approval: {reviewer: gpt-6.1-sol, verdict: APPROVE, date: 2026-10-21, payload_sha256: 8fa84c7daf832db9ab1ccf456f9f2c0036bc534ef8c3e5a29e876a6e58f378d7}
  notation: {approval: 'header.approval.payload_sha256 = sha256 of this file''s bytes with the one line
      starting ''  approval:'' (and its newline) removed; the approval verdict is valid only for that
      payload', row_key: '<canonical_id>|I|denominator=<d>,share_class=<ISIN>,shareholding_category=<member>|REPORTED|DERIVED,
      or <canonical_id>|I|-|REPORTED for a scalar row; the full key adds the run''s entity, basis STANDALONE,
      framework UNKNOWN, no currency, instant runs[].keys.I', value: 'a vendor value is never in this
      file: the companion sides[run][key][vendor] holds the lexeme and value of every VALUE vendor side,
      and point_checks[run] (same index) each point-check reading', xbrl_locator: 'as stage1 header.notation.xbrl_locator
      (src, c, ctx, u, d, lex, per, dims)', field_locator: 'src, path ([row].field in the NSE listing
      JSON), lex', vendor_locator: '{node: <SYM>/<vendor>/<n>}: the n-th node (0-based, document order)
      of header.companion''s tree for that company and vendor; its printed cell at the instant column
      (companion instant_columns) is the reading. Node order: Screener quarterly-shp rows, each followed
      by its drill-down holders, then yearly-shp the same way; Tijori company_detailed rows; Upstox data
      entries', threshold_locator: '{doc, pg, phrase}: phrase in the whitespace-collapsed text of that
      1-based PDF page; {vtext, line}: the companion text[vtext] on that 1-based line of the source',
    absent: 'a point-check member is taken as zero only when no context of the selected filing bears any
      XBRL member listed for it in header.descendants (the member and its format descendants by label
      correspondence, observed members only; the taxonomy is not retrievable, probe §11.1)', side: 'xbrl
      = {s, why, at} for a filed percentage: INVALID / PRECISION_UNSUPPORTED (the SHP pure lexeme declares
      no usable precision; the exact filed point is kept for R12 only, never a v or iv); a derived side
      adds calc OPERAND_INVALID (the propagated refusal) and operands (the filed member rows); a scalar
      row with no filed fact is NO_VALUE. vendors[<source/surface>]: one side per requested vendor table
      mapping the canonical id (header.tables): VALUE for a Screener or Tijori number, INVALID / PRECISION_UNSUPPORTED
      for an Upstox number (no declared precision), NO_VALUE for a marker or no ruled node at the key;
      at and labels when a ruled node is at the key', pair: 'a, b, out, why, diff, gap, diag: xbrl with
      each VALUE/INVALID vendor side (Upstox diagnostic), Screener with Upstox when both are VALUE/INVALID;
      every pair is NOT_COMPARABLE / PRECISION_UNSUPPORTED with diff and gap null (R10)', queue: 'as stage1
      header.notation.queue: one MEDIUM item per pair (MEDIUM_diagnostic for a diagnostic pair), and one
      corroboration item unless a NOT_COMPARABLE status is carried by a pair (NOT_COMPARABLE with no pair;
      NO_SOURCE); runs[].counts.queue totals every item including keyless ones, zero counts omitted',
    keyless: 'runs[].keyless.xbrl: count and sha256 of the sorted ''concept|contextRef'' lines of every
      filing fact no row locates (one LOW item each). keyless.vendors[<surface>]: every node yields an
      UNMAPPED NODE occurrence; an UNMAPPED node also yields one per printed cell; occurrences and sha256
      of their sorted ''NODE|<node id>'' / ''CELL|<node id>|<period>'' lines; one LOW item per node_item
      (NODE group) and per cell_item (a node''s UNMAPPED cells), LOW_diagnostic for Upstox. Screener drill-down
      holders are on SCREENER_INVESTORS', point_check: 'R12 line: key, vendor, at, members (located first-party
      lexemes), zero (members taken as zero), expr re-evaluates to v, verdict POINT_EQUAL when v rounded
      half-even to the vendor lexeme''s decimals equals the vendor value (companion point_checks, same
      index), labels, formal outcome or null when the key has no result row', holders: 'holders[<SYM>]:
      filing (every typed axis of the instance), screener (every bucket of a Screener page node) and tijori
      (every level-2 node with holder children) lists, each the header.holder_rules class of its list;
      a THRESHOLDED class carries the threshold tuple its located text states', tree: 'tree[<SYM>][<vendor>]:
      counts (nodes, holders, cells, markers = printed non-numbers such as a dash, depth) and ruled nodes
      {id: {key, labels}}; every other node is UNMAPPED. The full inventory (label, parent, path, depth,
      periodicity, source node id, value or marker per offered period, key or UNMAPPED, labels) is in
      the companion'}
  interpretations: ['I1 keys: shp_holding_pct per filed CategoryOfShareholdersAxis percentage of header.members
      at the denominators listed for the member (eight categories at both, five ruled subcategories at
      TOTAL_SHARES only, as the shipped first-party entries); each v3 basket row (header.baskets) at every
      denominator a shp_holding_pct row carries (the engine''s aggregated-operand evidence); the scalar
      shp_num_shareholders row (no dimension template)', 'I2 vendor rulings (Sol R9 divergence rulings,
      d8-probe §13.5-§13.6): Screener quarterly A (D); B2, B1, domestic SWF, B4, C2 (D, Bd). Tijori A,
      Indian Promoters, Foreign Promoters (D); B + C2 (D); B1 + B2 and B4 + C2 (D, Bd); Individual < 2
      lac (D, Bd: the label omits residency); IEPF (D). Upstox A (D); B2 and B4 + C2 (D, Bd). Every other
      node is UNMAPPED: Screener yearly rows, drill-down holders and the shareholder-count row, Tijori
      LLP, holders, the custodian-DR node and the shareholder-count row, Upstox mutual_funds and other_dii',
    'I3 every vendor key is TOTAL_SHARES with ''denominator assumed, not vendor-stated'' (R10); a VOTING_RIGHTS
      key''s vendor sides are all NO_VALUE and it forms no pair', 'I4 R12 candidates are ruled nodes printing
      a number at the instant, Upstox included; a ruled node printing a marker at the instant has no line',
    'I5 cor is NOT_COMPARABLE / PRECISION_UNSUPPORTED for every INVALID first-party side, paired or not
      (the corroboration table''s invalid-first-party row); NO_SOURCE for the scalar row; Upstox enters
      no status']
  pins:
    family: SHAREHOLDING
    basis: STANDALONE
    framework: UNKNOWN
    dictionary: v3
    mapping_set: v7
    extractors: [nse-shp-v2, screener-shp-v2, tijori-shp-v2, upstox-shp-v2]
    mode: AS_KNOWN
  units: {PERCENTAGE: '%', COUNT: shares (exact count; the stage1 UNITS name of an integer count)}
  row_units: {shp_holding_pct: '%', shp_public_shareholding_plus_employee_trust_pct: '%', shp_non_institutions_plus_employee_trust_pct: '%',
    shp_institutions_domestic_plus_foreign_pct: '%', shp_num_shareholders: shares}
  cli: {ingest: fundamentals shareholding ingest --symbol <SYM> --instant 2026-06-30 --raw-root data/raw/shareholding
      --snapshot-root <tmp> --generation 2, run: fundamentals compare run --family shareholding --entity <KEY> --period-end
      2026-06-30 --basis standalone --mode as_known --dictionary v3 --mapping-set v7 --normalisation-policy v2
      --vendor screener-subscriber/SCREENER_SHAREHOLDING
      --vendor screener-subscriber/SCREENER_INVESTORS --vendor tijori/shareholding --vendor upstox/share-holdings,
    report: fundamentals compare report --family shareholding --entity <KEY> --period-end 2026-06-30 --basis
      standalone}
  arithmetic: point_checks[].expr (exact; test_recorded_arithmetic_is_exact)
