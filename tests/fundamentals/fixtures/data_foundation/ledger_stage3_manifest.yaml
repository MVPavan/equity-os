# Ledger Stage 3 frozen manifest (D5 Task 4). Generated by a throwaway authoring aid from the approved ledger manifests; see header.
header:
  manifest: ledger_stage3
  spec: docs/specs/2026-10-12-report-ledger-memory-and-data-lifecycle.md (Stage 3, §3 Generated views, O5, P2); plan docs/workstreams/data-foundation/plans/D5.md (Task 4, D1, rulings V1, V4)
  hand_verification: {verifier: D5.4 implementer, date: '2026-10-15', method: 'Authored with scratchpad/execution/d5/author_ledger_stage3_manifest.py, which reads only the two approved ledger manifests (LEDGER1, LEDGER2, as YAML data) and migration 0021''s text, and never imports fundamentals or any repo test module. The Stage 2 end state is LEDGER1''s five imported versions plus LEDGER2''s two correctives (each a successor of the LEDGER1 version of its predecessor period and its kind). Copied values (report stock/period/kind, statuses, decision kinds, corrective validation mode/creator, claim states, item fields, the promoted retrieval''s needs_revalidation) carry field locators naming the LEDGER1/LEDGER2 value they equal; an imported version that has a corrective takes its status from LEDGER2 predecessor.status_after, the others from their own status. Derived values follow header.rules: stems by chain position, the imported versions'' RETROSPECTIVE/PANEL validation (ledger/importer.py validates each import RETROSPECTIVE as the panel role; the Stage 2 build validates only the correctives), empty revalidation flags (the one promoted item has needs_revalidation false). Untrusted lists are every non-MATCH claim state of the version''s located claims; reader rows and counts follow from the files. Every status was re-derived by status_map from the decision kinds and matched the copied one. View names located on their CREATE VIEW lines in 0021. No value, state or count came from product code, a test database or a probe.'}
  approval: {reviewer: gpt-6.1-sol, verdict: APPROVE, date: 2026-10-15, payload_sha256: 86cd7697b05bf62323da0a24707f9644b62eb292ea7f1136b4eecce27fd7c3dd}
  notation: {locators: as ledger_stage1 header.notation.locators, files: 'one per report version of the Stage 2 end state, in export order (period, kind, chain position); stem is the export file stem (<stem>.md narrative, <stem>.status.md note); source locates the version''s entry in LEDGER1/LEDGER2; *_at locators bind copied values; derived names each derived field''s header rule; untrusted entries are (claim key, state), each state located at its claim', memory: 'the promoted items of the stock (memory.md, promoted_memory_view); supports by the corrective''s file stem and claim key', reader: 'expected rows as the reader role sees them: report_status_view one per file (version = v<n> of the stem, mode = latest_validation_mode, untrusted = untrusted_claims), promoted_memory_view one per memory item; refused: each op on each target is refused to the reader', approval: as stage1 header.notation.approval}
  arithmetic: none
  vault_in_scope: false
  size: {files: 7, untrusted: 193, memory: 1}
  status_map: {heads: {SUBMIT: IN_REVIEW, IMPORT_SEAL: HISTORICAL, APPROVE: APPROVED, IMPORTED_APPROVAL: APPROVED, REQUEST_CHANGES: CHANGES_REQUESTED, REJECT: REJECTED, WITHDRAW: WITHDRAWN}, no_decision: DRAFT, superseded: {from: [APPROVED, HISTORICAL], by: [APPROVE, IMPORTED_APPROVAL]}}
  rules: {stem: '<period>-<kind>-v<n> from the located report period and kind; n = 1 for an imported (LEDGER1) version, a chain root; a LEDGER2 corrective''s n is its predecessor''s n + 1, the predecessor being the file of the located predecessor period and the corrective''s kind', imported_validation: 'an imported version (located decisions begin IMPORT_SEAL) has latest validation RETROSPECTIVE by PANEL (ledger/importer.py), unchanged by the Stage 2 build, which validates only the correctives', status_map: 'status = header.status_map.heads[last located decision], none = no_decision; then superseded.from statuses with a superseded.by decision on any later version of the same report (same period and kind) are SUPERSEDED (plan D1)', flags: 'a file''s flags are the promoted items with needs_revalidation true citing it; the one promoted item''s located needs_revalidation is false, so every file''s flags are []'}
