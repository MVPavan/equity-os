    markers: [tijori]
    marker_before_purge_first: true
    expired_after_purge_first: [X-Q2P, X-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-TIJ, N-UPC, U-INS, W-CSV]
    tijori: {N-TIJ: {state: EXPIRED, record_sha256: 2f69a7959f830965147f19b74abaf6dde6e6bdf9e0e8a25780fb4005054bec6a}, L-TIJ: {state: EXPIRED, record_sha256: 4d6b9832d9b0b691894be96c48e90af26e67abec5a92f529439d49cec855ed4e}}
    retained_hash_match: [L-X, X-Q1, P-Q4, M-Q4]
    purge_records: every expired label has one; existence only, as pre_purge
    record_sha256: every label the set archives has its restored record.json digest (header.notation.record_sha256) equal fixtures[label].record_sha256
    replay_expired: [RUN-L, RUN-N]
