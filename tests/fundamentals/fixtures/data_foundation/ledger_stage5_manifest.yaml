    set: "S0'"
    phase1: ok
    phase1_hash_match: [L-X, X-Q1, X-Q2P, X-Q4, P-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-TIJ, N-UPC, U-INS, W-CSV]
    licence_ends: []
    markers: []
    expired_after_purge_first: [X-Q2P, X-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-UPC, U-INS, W-CSV]
    note: X-Q2P is RESTORED in the primary yet expires here (restoration is not journaled; R11)
    retained_hash_match: [L-X, X-Q1, P-Q4, N-TIJ]
    purge_records: every expired label has one; their fields restate no eligibility (R12), so only their existence is frozen
    record_sha256: every label the set archives has its restored record.json digest (header.notation.record_sha256) equal fixtures[label].record_sha256
    replay_expired: [RUN-L, RUN-N]
    ok: true
  licence_end:
