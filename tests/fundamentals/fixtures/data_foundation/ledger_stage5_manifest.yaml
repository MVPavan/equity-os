# Ledger Stage 5 frozen manifest (D9 Task 8): retention and replay. Hand-decided under ruling R15; see header.
header:
  manifest: ledger_stage5
  spec: docs/specs/2026-10-12-report-ledger-memory-and-data-lifecycle.md (§5 Retention, §6 Replay after deletion, Success Criteria Stage 5); plan docs/workstreams/data-foundation/plans/D9.md (rulings R2-R15, Task 8 inventory, Task 9 flow); amendment docs/blueprint/amendments/2026-10-12-a05-derived-amounts.md (redaction inventory)
  hand_verification: {verifier: 'D9.8 independent manifest authors: r1, r2, r3 and r4 (all claude-opus-5-5)', date: '2026-10-18', method: 'Decided by hand from the R15 inputs: retained fixture bytes (hashed by scratchpad/execution/d9/manifest/hash_sources.py, plain hashlib/json, never importing fundamentals), the frozen Stage 1/2 manifests, ledger spec §5/§6, plan D9 rulings R2-R14 and the Task 9 flow, the approved A-05 record, and, as explicit reviewer clarification, the statements of system behaviour in the r1 review (gpt-6.1-sol, 2026-10-17, REQUEST_CHANGES): probes before recovery over non-EXPIRED facts incl. PURGE_PENDING, purge records cite the latest successful probe of their source, the licence-end command runs the ordinary purge, eligibility reasons WINDOW/CATALOG_CEILING/LICENCE_END, restore replays every stored run, N-TIJ and N-UPC yield no occurrence. Pre-D9 code and fixtures were read to learn what intake, runs and seeds produce: vendor adapters (vendor_tijori, vendor_upstox), evidence/admission.py, compare/routing.py, and, at the D9 plan commit b873865, compare/run.py, compare/run_store.py, compare/queue.py, evidence/vendor_ingest.py, pg/backup.py, entity/discovery.py, coverage/registry.py, coverage/screens.py, tests coverage_support.py and stage1_e2e_support.py, plus parts of migrations 0001, 0006, 0008, 0010, 0011, 0025 and 0026. r1 author: saw two SQL lines of src/fundamentals/retention/holds.py in a grep result and, after writing, ran one test_retention_holds case; no value was taken from either. r2 author: revised every section; did not read, import or run D9 code or D9 tests, and opened none of the review''s D9 file:line references; incidental exposure (r2): the git diff hunk of tests/fundamentals/retention_support.py shown three context lines (a queue-disposition seed INSERT and the store-clock setval), and file-name-only listings (D9 commit file lists; a grep naming retention/holds.py). r3 author: acted on the r2 review (gpt-6.1-sol, 2026-10-17, REQUEST_CHANGES), taking as clarification only its stated behaviour (RUN-L0 fails with no evidenced reporting currency; an ADD without REMOVE covers L-X, existing captures included, Q3 ruling); removed RUN-L0, made RUN-L the watchlist batch''s run after intake and before the ADD (L-X stays COVERED, so no eligibility, dry-run, purge, backup, replay or restore expectation changed), declared header.script.purge_runs, and extended the checker; read pre-D9 tests/fundamentals/coverage_support.py and the D9 plan''s R2, R5, RP3 and verification case C3; did not read, import or run D9 code or D9 tests, and opened none of the review''s D9 file:line references. Classes follow R2, eligibility R5 with the R3 ceiling, purge and recovery R8, journal and sanitize R11, backup and restore R12, re-fetch R10, replay R13. Every blob hash is a bound file''s SHA-256 (M-Q4: header.derived_blobs); record hashes are literal where the record.json is copied verbatim (header.record_digests), else RUNTIME_BINDING (header.notation.record_sha256). r4 author: the Task 9 e2e implementer reported three disagreements and a mapping-set choice; the r4 author took none of its values and re-derived each from the named sources: (1) record_sha256 convention: pre-D9 contracts/snapshot.py:148-155 and :340-342 (CaptureRecord.record_sha256 = sha256 of canonical_json, sort_keys and separators (",",":"), no newline) and store/snapshot_store.py at f544ca4:192 (record.json = that text + one LF); scratchpad/execution/d9/manifest/record_digests.py (plain hashlib/json, never importing fundamentals) showed each retained record.json is canonical JSON ending in exactly one LF, and hashed it without that LF; the r1-r3 literals were the whole-file hashes, so notation.record_sha256 is redefined and the four literals recomputed (CONFIRMED). (2) A-SCR attempts: pre-D9 tests/fundamentals/stage1_e2e_support.py at b873865:76 and :212-219 (one ingest_vendor per Screener section, four sections, same capture) and evidence/vendor_ingest.py at b873865:351-389 (each ingest stores one EXTRACTION attempt; no unique key, migration 0005:84 dropped it); STAGE1 I11 names the four sections; extraction_attempts 1 -> 4 (CONFIRMED). (3) U-APQ values: U-APQ body (3 summary categories and 9 full_statement particulars, 4 history points each: 48 occurrences), evidence/vendor_upstox.py at b873865:112-143 (no declared precision, so every occurrence is PrecisionKind.UNSUPPORTED via vendor_ingest.json_occurrence), evidence/interpret.py at b873865:166 and :690-692 (UNMAPPED and PRECISION_UNSUPPORTED interpretations carry no value), STAGE1 runs[].unmapped A-UPQ entries (7 rows x 4 = 28) and I16 selection (5 rows x 4 = 20 INVALID), upstox/v2 entry files identical in mapping sets v4 and v5; interpretations.value removed from cleared_before (CONFIRMED). (4) mapping sets: config/mappings/v5.yaml (ba1c068, before the D9 plan) is v4 plus xbrl/v5/in_capmkt.yaml, constructions/v2.yaml and statement_anchors/v2.yaml; X-Q4 and X-Q5 reference in-capmkt-ent-2026-01-31.xsd, which only xbrl/v5 maps; vendor entry files are the same in both sets and no v5-only file pins a fixture blob (hash_sources.py QUAL scan), so header.script.mapping_sets is added and no other expectation changes. r4 did not read, import or run D9 code or D9 tests, nor the uncommitted Task 9 e2e files. Instants and windows are rules over the store clock (header.clock), never wall-clock literals.'}
  approval: {reviewer: gpt-6.1-sol, verdict: APPROVE, date: 2026-10-18, payload_sha256: d33c46b76b57ebac5184ce0535507cb85361d6768c0620b2be1aba371b926500}
  notation:
    labels: 'fixture labels are capture labels (fixtures); stored comparison runs RUN-* (header.script.runs); purge runs P1, P2, P3 (header.script.purge_runs); probe invocations P1, rerun, P3 (probe.invocations); backup sets S0 (instant A), S1a/S1b (final backups of P1/P2), S2 (before licence end), S3 (final backup of P3); a primed name (S0'', S2'') is a copy taken outside the backup directory'
    record_sha256: 'capture_refs.record_sha256 convention (pre-D9 contracts/snapshot.py:340-342): the SHA-256 of the record''s canonical JSON (sorted keys, separators ",", ":"), which is the stored record.json without its one trailing LF; never the whole file''s hash. A 64-hex value is that digest of the retained record.json copied verbatim into the store (header.record_digests, from header.sources <label>-REC); RUNTIME_BINDING marks a record minted at intake under the store clock: the e2e hashes the record.json written at registration under this convention, asserts it equals capture_refs.record_sha256, and asserts that value at every later read, in every backup set and after every restore (an invariant binding, not a literal)'
    blob_sha256: every blob is the SHA-256 of the file bound under the same label in header.sources, except M-Q4 (header.derived_blobs)
    since: '{anchor, months}: add_months(anchor, months) (header.rules); anchor verified_at is the label''s verification run''s created_at (no dispositions exist on those runs), registered_at the capture_refs.registered_at; LICENCE_END is the licence end''s ended_on (header.script)'
    holds: 'holds: [..] is the exact root set; holds_include / holds_exclude bound it where closed queue roots of RUN-L may also reach the capture (their HoldRoot member is not named here; R5 makes them irrelevant: L-X is COVERED, L-TIJ is vendor-bounded so R3 sets them aside). Names: OPEN_QUEUE_ITEM (an undisposed queue item reaches the capture), QUALIFICATION_FIXTURE (a config/mappings fixture capture_sha256 equals the blob; holds_at locates it)'
    reasons: 'ELIGIBLE and purge-record reasons: WINDOW (class window passed, no hold set aside), CATALOG_CEILING (R3 set a hold aside), LICENCE_END'
    outcomes: 'attempt outcomes are rows of retention_probes / refetch_attempts: MATCH, MISMATCH, FAILED (with category); command outcomes are capture states and exit codes: a MATCH re-fetch gives RESTORED and exit 0, MISMATCH keeps EXPIRED, publishes a new capture and exits 3, FAILED keeps EXPIRED, publishes nothing and exits 2'
    probe_ref: '{latest_match: <source>} = the greatest-id MATCH retention_probes row of that source existing when the purge record commits (header.rules.probe_record); NOT_REQUIRED for non-exchange classes'
    incident: 'true = a HIGH row that eqos.retention_incidents shows open (R9); a probe incident closes on a later MATCH probe of its source, a mismatch incident when its capture is RESTORED'
    digest: 'per preservation set: sha256 over the UTF-8 bytes of the selected rows'' `to_jsonb(t)::text` (PostgreSQL jsonb text, every column), rows in the stated order, joined by one LF; computed at each checkpoint; equal = identical hex at every checkpoint'
    checkpoints: 'D0 after the dry-run (before the first purge); D1 after the purge rerun; D2 after the three re-fetches and the X-Q2P re-extraction; D3 after licence-end'
    approval: as stage1 header.notation.approval
  arithmetic: none
  rules:
    p4_exchange: EXCHANGE_REFETCHABLE since = add_months(verified_at, 3) (ledger §5 P4); no verification time, or no address, is KEEP (R5, R14)
    four_quarters: VENDOR and IDENTITY since = add_months(registered_at, 12) (ledger §5 four quarters)
    month_end: add_months clamps the day to the target month's last day (R5)
    order: licence end reached -> ELIGIBLE(since=LICENCE_END, reason LICENCE_END), holds notwithstanding; effective COVERED -> KEEP; relevant holds -> HELD(roots); then the anchor rule, reason WINDOW, or CATALOG_CEILING when R3 set a hold aside (R5)
    r3_ceiling: vendor-bounded sources (screener, screener-subscriber, tijori, upstox) are held only by OPEN_QUEUE_ITEM; any other root is set aside; non-vendor sources are held by any root, closed queue items and dispositions included (R4)
    covered: 'an EXCHANGE_REFETCHABLE capture is effectively COVERED when a linked entity has an ADD not followed by a REMOVE (R2); per the r2 review''s Q3 ruling (and plan D9 case C3, COVERED after ADD; REMOVE leaves the earlier capture COVERED) the ADD covers captures registered before it too. The script registers L-X (step 2), runs RUN-L (step 4), then ADDs LAURUSLABS (step 5) and never removes it, so L-X is COVERED from step 5 on, at every checkpoint. L-TIJ and W-CSV, registered before the ADD, stay VENDOR (ledger §5: watchlist add upgrades only non-vendor originals, recording RETENTION_LIMITED for the rest)'
    restored: RESTORED is evaluated like RETAINED; a re-fetch keeps the capture's verification anchor (R5, R10)
    verified: the earliest COMPLETE run with a SELECTED PACKAGE input for the capture's package and no undisposed queue item on that package; time = the later of its created_at and the last disposition (R5)
    probe: up to 3 eligible EXCHANGE_REFETCHABLE captures per source, lowest ids, before recovery, over non-EXPIRED facts (PURGE_PENDING included); a failure is a HIGH row and halts that source's exchange deletions for the invocation (R8, R9, review finding 5)
    probe_record: an EXCHANGE_REFETCHABLE purge record cites the latest successful probe of its source (review finding 5), so P1's records cite the rerun's probes, not the crashed invocation's
    blob: a blob is eligible only when every non-EXPIRED capture using it is; no two captures share a blob, so eligible blobs = eligible captures
  clock:
    A: 'wall time (store clock not set): every instant-A write (header.script steps 1-8); t_A = eqos.store_now() read right after S0 is published'
    B: add_months(t_A, 13), set as migrator through eqos.store_clock_us before the dry-run; every later command reads a store clock >= B (store_now is monotonic)
    windows_passed_at_B: '13 > 12 > 3: every VENDOR/IDENTITY registration and every verified EXCHANGE_REFETCHABLE anchor (all <= t_A) is past its window at B'
  script:
    config_root: 'a tmp copy of config/ whose retention/holds.yaml is `manifests: []`, passed as --config-root to the dry-run, both purges and licence-end; config/mappings is kept, so qualification pins stay roots. Why: with the committed list, the stage1 manifest and this manifest pin every fixture blob as a frozen-manifest root; that would HOLD every non-vendor fixture (any root holds them) and would add CATALOG_CEILING to every vendor-bounded one (R3 sets the root aside; they stay ELIGIBLE). Excluded roots: stage1, stage2, ledger_stage1, ledger_stage2, ledger_stage3 and ledger_stage5 manifest inputs. Task 9 does not test production manifest-root integration (Task 3 H1 does). Runs pin the repo config/ unchanged'
    store: one tmp snapshot root; L-TIJ, N-TIJ, N-UPC and U-APQ are copied verbatim from data/raw/snapshots/v1 (record.json and body, blob relinked) before vendor ingest; nothing under data/ is written
    steps:
    - '1 seeds: APARINDS (seed_apar), LAURUSLABS (test_watchlist_xbrl_ingest._seed), NETWEB (seed_netweb)'
    - '2 first-party intake (each binding''s URL = the retrieval-manifest url): L-X (L-MAN FY25_Q3 xbrl-consolidated), X-Q1 (A-MAN FY26_Q1 xbrl-consolidated-comparator), X-Q2P (A-MAN FY25_Q2 xbrl-consolidated-comparator), package FY26_Q4 = X-Q4 + P-Q4 (A-MAN xbrl-consolidated + results, issuer config ISSUER-Q4), X-Q5 (A-MAN FY27_Q1 xbrl-consolidated)'
    - '3 vendor intake: L-TIJ (LAURUSLABS, 2024-12-31, consolidated), A-SCR (Screener page staged, four sections, APARINDS FY26_Q2 as Stage 1: one vendor ingest per section on the same capture, so four EXTRACTION attempts), U-APQ (APARINDS upstox income-statement quarterly consolidated, as Stage 1 A-UPQ), N-TIJ and N-UPC (Stage 1 NETWEB flow); identity: U-INS through `coverage registry --instruments`'
    - '4 runs RUN-L, RUN-N, RUN-Q2, RUN-Q4, RUN-Q5 (header.script.runs)'
    - '5 watchlist, deterministic (no random tag): W-CSV is registered through entity.discovery.store_captures with Request(unit SCREENER, source/surface SCREEN_EXPORT, url ''ledger-stage5-synthetic'') and body = the W-CSV file bytes; then coverage_support.batched''s runtime and owner rows with tag ''ledger-stage5-synthetic'' and the batch result''s run_id = RUN-L (no skeletal run is inserted); the batch completes; then lifecycle.decide ADD on LAURUSLABS, after L-X and L-TIJ are registered (header.rules.covered)'
    - '6 queue: every queue item of RUN-L is disposed through compare.queue.record_disposition (kind DISMISSED, reason ''ledger Stage 5 e2e'', decider owner, evidence_ref ''ledger-stage5''); then one SEED undisposed queue item of RUN-N whose single queue_item_inputs row has attempt_id = N-TIJ''s EXTRACTION attempt (an R4 edge, no occurrence or interpretation), never disposed'
    - '7 facts: a NATIVE fact store ''ledger-stage5''; evidence.admission.admit_run(RUN-Q5, store_id ''ledger-stage5''), created >= 1'
    - '8 `retention classify`; `db backup` S0, copied aside as S0''; read t_A'
    - '9 set the store clock to B; `retention purge --dry-run`; checkpoint D0'
    - '10 `retention purge` crashed at FILES_DELETED (recovery.crash); `retention purge` rerun; checkpoint D1; direct replay of every run'
    - '11 `retention refetch` X-Q2P, then X-Q4, then X-Q5; X-Q2P''s restored body is re-extracted in process by the XBRL extractor (no ingest, no write) and its anchor keys compared with the stored occurrences; checkpoint D2'
    - '12 `db restore --replay-runs` of S0'' (--backup-dir the backup directory)'
    - '13 `db backup` S2, copied aside as S2'''
    - '14 `retention licence-end --source tijori --ended-on <UTC date of B> --reason "ledger Stage 5 e2e"`; checkpoint D3; direct replay of every run'
    - '15 `db restore --replay-runs` of S2'' (--backup-dir the backup directory)'
    runs:
      RUN-L: {entity: LAURUSLABS, period_end: '2024-12-31', vendors: [tijori/financials], publish: execute_run (routing on), inputs: [L-X, L-TIJ], why: 'the watchlist batch''s same-entity run (header.script.steps 5); vendor-derived result_source_values, queue items and dispositions; Stage 1 LAURUSLABS-Q3FY25 without Screener'}
      RUN-N: {entity: NETWEB, period_end: '2024-12-31', vendors: [tijori/financials, upstox/income-statement], publish: execute_run (routing on), inputs: [N-TIJ, N-UPC], stage1_at: {src: STAGE1, path: 'runs[9].run', lex: NETWEB-Q3FY25}, queue_at: {src: STAGE1, path: 'runs[9].counts.queue', lex: '{}'}}
      RUN-Q2: {entity: APARINDS, period_end: '2024-09-30', package: FY25_Q2, vendors: [], publish: verification}
      RUN-Q4: {entity: APARINDS, period_end: '2026-03-31', package: FY26_Q4, vendors: [], publish: verification}
      RUN-Q5: {entity: APARINDS, period_end: '2026-06-30', package: FY27_Q1, vendors: [], publish: verification}
    purge_runs:
      P1: {records_by: rerun, why: 'crashed at FILES_DELETED before writing records (recovery.after_crash.purge_records); the rerun''s recovery completes its intents and writes their records'}
      P2: {records_by: rerun, why: the rerun's own run; it expires nothing}
      P3: {records_by: P3, why: the tijori licence-end purge}
    mapping_sets: {APARINDS: v5, LAURUSLABS: v4, NETWEB: v4, why: 'X-Q4 and X-Q5 reference in-capmkt-ent-2026-01-31.xsd, mapped only by xbrl/v5/in_capmkt.yaml (config/mappings/v5.yaml = v4 plus xbrl/v5, constructions/v2, statement_anchors/v2); every APARINDS ingest and run (X-Q1, X-Q2P, FY26_Q4, X-Q5, A-SCR, U-APQ, RUN-Q2, RUN-Q4, RUN-Q5) uses v5, LAURUSLABS and NETWEB stay on v4 as in Stage 1. Both sets hold the same screener/v2, tijori/v3 and upstox/v2 entry files, and no v5-only file names a fixture blob, so vendor interpretations, qualification roots and every other expectation are the same under either set'}
    verification_publish: 'a replayable run record without queue items: compare.resolve.resolve over the request, then RunStore.publish(manifest, rows, definition_set_id=..., queue_drafts=()) with the manifest execute_run would build (full document, pins, inputs, run_status(rows)); asserted status COMPLETE. Why: R4 makes every queue item and disposition a root and any root holds non-vendor material; routed items name the package''s occurrences and interpretations, so a routed run would HOLD the very captures it verifies (header.rules.verified, r3_ceiling)'
    fetch_purge: every purge invocation (P1 crashed, the rerun, P3) fetches the retained bytes of the URL's fixture, except P-Q4's URL, which raises FetchFailure(TIMEOUT)
    fetch_refetch: X-Q2P's URL returns its retained bytes; X-Q4's returns its retained bytes followed by one LF (0x0a); X-Q5's raises FetchFailure(HTTP_STATUS, 404)
  derived_blobs:
    M-Q4: {from: X-Q4, bytes: X-Q4's bytes followed by one LF (X-Q4 does not end with LF), sha256: a988e8b0229bc092efd59d1510d7cca66cae06b8fb9024d3075281952caada26}
  record_digests:
    U-APQ: {from: U-APQ-REC, bytes: the record.json without its trailing LF (header.notation.record_sha256), sha256: efa7a53ed02272fd247b008b258c36bd558f0ddb28d7fe08db8d8f2bc4ddd363}
    L-TIJ: {from: L-TIJ-REC, bytes: the record.json without its trailing LF (header.notation.record_sha256), sha256: 4d6b9832d9b0b691894be96c48e90af26e67abec5a92f529439d49cec855ed4e}
    N-TIJ: {from: N-TIJ-REC, bytes: the record.json without its trailing LF (header.notation.record_sha256), sha256: 2f69a7959f830965147f19b74abaf6dde6e6bdf9e0e8a25780fb4005054bec6a}
    N-UPC: {from: N-UPC-REC, bytes: the record.json without its trailing LF (header.notation.record_sha256), sha256: b29a9139e3d55bab6ed22933ceea85215c39a8fa7626d054e6b90fcb0a4f53c1}
  upstox_redaction: 'U-APQ is the nonempty retained Upstox fixture (Stage 1 A-UPQ, pre-D9): its 48 occurrences carry numeric lexemes and disclosure.anomalies, so it proves Upstox payload redaction through occurrences.raw_value_text and disclosure.anomalies only; its 48 interpretations (28 UNMAPPED, 20 INVALID PRECISION_UNSUPPORTED: Upstox numerals declare no precision) all have a NULL value at D0, so interpretations.value proves nothing for Upstox; N-UPC is the empty response and yields no occurrence'
