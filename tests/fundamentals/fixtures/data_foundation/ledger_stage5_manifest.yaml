  checkpoints: [D0, D1, D2, D3]
  sets:
    non_vendor_occurrences: {table: occurrences, capture_of: [L-X, X-Q1, X-Q2P, X-Q4, P-Q4, X-Q5], order: id, nonempty_for: [L-X, X-Q1, X-Q2P, X-Q4, P-Q4, X-Q5]}
    non_vendor_interpretations: {table: interpretations, capture_of: [L-X, X-Q1, X-Q2P, X-Q4, P-Q4, X-Q5], order: id, nonempty_for: [L-X, X-Q2P, X-Q4, X-Q5]}
    fact_rows: {table: fact_rows, rows: target_store 'ledger-stage5', order: handle, nonempty: true}
    fact_admissions: {table: fact_admissions, rows: store_id 'ledger-stage5', order: id, nonempty: true}
    results: {table: results, rows: all, order: id, nonempty_for_runs: [RUN-L, RUN-Q2, RUN-Q4, RUN-Q5]}
    pair_outcomes: {table: pair_outcomes, rows: all, order: id, nonempty: true}
    queue_items: {table: queue_items, rows: all, order: id, nonempty_for_runs: [RUN-L, RUN-N]}
    queue_item_inputs: {table: queue_item_inputs, rows: all, order: id, nonempty: true}
    queue_dispositions: {table: queue_dispositions, rows: all, order: id, nonempty_for_runs: [RUN-L]}
  rule: every set's digest is equal at D0, D1, D2 and D3; nonempty bounds are checked at D0; the A-05 kept outcomes (results, pair_outcomes, queue items, dispositions) and the non-vendor payload therefore survive both purges, the re-fetches and the licence end
  m_q4: M-Q4 has 0 occurrences and 0 interpretations (no automatic re-ingest after a mismatch)
backup:
  S0: {at: A, journal_watermark: 0, initialises: [licence-ends.json, expiry-journal.json], retained: [L-X, X-Q1, X-Q2P, X-Q4, P-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-TIJ, N-UPC, U-INS, W-CSV], expired: [], copied_as: "S0'"}
  after_rerun:
    sets_deleted: [S0]
    sets_present: [S1a, S1b]
    remnants: none
    S1a: {run: P1, journal_watermark: 2, retained: [L-X, X-Q1, P-Q4, N-TIJ], expired: [X-Q2P, X-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-UPC, U-INS, W-CSV]}
    S1b: {run: P2, journal_watermark: 4, retained: [L-X, X-Q1, P-Q4, N-TIJ], expired: [X-Q2P, X-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-UPC, U-INS, W-CSV]}
  S2: {at: step 13, journal_watermark: 4, retained: [L-X, X-Q1, X-Q2P, P-Q4, N-TIJ, M-Q4], expired: [X-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-UPC, U-INS, W-CSV], copied_as: "S2'"}
  set_contents: 'every listed label''s archived record.json has the record digest (header.notation.record_sha256) fixtures[label].record_sha256; each retained label''s body hashes to its blob_sha256; each expired label is listed with its url (fixtures, null where null) and its latest purge record and has no body'
  journal:
  - {id: 1, kind: FENCE, run: P1, captures: [X-Q2P, X-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-UPC, U-INS, W-CSV]}
  - {id: 2, kind: COMPLETE, run: P1, expired: [X-Q2P, X-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-UPC, U-INS, W-CSV], cancelled: []}
  - {id: 3, kind: FENCE, run: P2, captures: []}
  - {id: 4, kind: COMPLETE, run: P2, expired: [], cancelled: []}
refetch:
  at: after the purge rerun, before licence end (Task 9 order)
  X-Q2P:
    fetch: retained bytes
    attempt: {outcome: MATCH, category: null, http_status: null, fetched_sha256: c44ac3766fedbf697bb91551d55c59015a3253bac99ec95ff03f1bc7795b9d60}
    command: {state: RESTORED, exit: 0}
    unchanged: [capture_ref_id, registered_at, first_seen_at, record_sha256, blob_sha256, verification anchor]
    body: present and read verified
    reextract: anchor keys equal the stored occurrences' anchor keys; nothing written
  X-Q4:
    fetch: retained bytes + LF
    attempt: {outcome: MISMATCH, category: null, http_status: null, fetched_sha256: a988e8b0229bc092efd59d1510d7cca66cae06b8fb9024d3075281952caada26, severity: HIGH, incident: true, code: REFETCH_MISMATCH}
    command: {state: EXPIRED, exit: 3, new_capture: M-Q4}
    body: absent
  X-Q5:
    fetch: FetchFailure(HTTP_STATUS, 404)
    attempt: {outcome: FAILED, category: HTTP_STATUS, http_status: 404, fetched_sha256: null}
    command: {state: EXPIRED, exit: 2, published: nothing}
  open_incidents: [P1 and rerun probe rows of aparinds-fy26-q4-results-pdf (TIMEOUT), the X-Q4 MISMATCH attempt]
licence_end:
  command: {steps: [marker, licence-ends.json entry, licence_ends row, purge], exit: 3, run: P3}
  probe: probe.invocations.P3
  intents: [X-Q2P, N-TIJ]
  states: {L-X: RETAINED, X-Q1: RETAINED, X-Q2P: EXPIRED, X-Q4: EXPIRED, P-Q4: RETAINED, X-Q5: EXPIRED, A-SCR: EXPIRED, U-APQ: EXPIRED, L-TIJ: EXPIRED, N-TIJ: EXPIRED, N-UPC: EXPIRED, U-INS: EXPIRED, W-CSV: EXPIRED, M-Q4: RETAINED}
  records:
    X-Q2P: {run: P3, class: EXCHANGE_REFETCHABLE, reason: WINDOW, url: 'https://nsearchives.nseindia.com/corporate/xbrl/INDAS_113920_1293440_30102024104705.xml', probe: {latest_match: nse-indas-xbrl-consolidated, invocation: P3}}
    N-TIJ: {run: P3, class: VENDOR, reason: LICENCE_END, url: null, probe: NOT_REQUIRED}
  record_counts: {X-Q2P: 2, N-TIJ: 1}
  blobs:
    present: [L-X, X-Q1, P-Q4, M-Q4]
    absent: [X-Q2P, X-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-TIJ, N-UPC, U-INS, W-CSV]
  tombstones:
    labels:
      N-TIJ: {occurrences: 0, interpretations: 0, result_source_values: 0, extraction_attempts: 1, cleared_before: [acquisition_attempts.reason], json_dropped: []}
  journal:
  - {id: 5, kind: FENCE, run: P3, captures: [X-Q2P, N-TIJ]}
  - {id: 6, kind: COMPLETE, run: P3, expired: [X-Q2P, N-TIJ], cancelled: []}
  sets: {sets_deleted: [S1a, S1b, S2], sets_present: [S3], remnants: none}
  S3: {run: P3, journal_watermark: 6, retained: [L-X, X-Q1, P-Q4, M-Q4], expired: [X-Q2P, X-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-TIJ, N-UPC, U-INS, W-CSV]}
  why_deleted: 'S1a and S1b archive N-TIJ''s body (licence-ended source); S2 archives X-Q2P''s and N-TIJ''s bodies, both in the expiries after its watermark 4 (event 6)'
  open_incidents: [P1, rerun and P3 probe rows of aparinds-fy26-q4-results-pdf (TIMEOUT), the X-Q4 MISMATCH attempt]
recovery:
  crash: FILES_DELETED
  after_crash:
    states: {X-Q2P: PURGE_PENDING, X-Q4: PURGE_PENDING, X-Q5: PURGE_PENDING, A-SCR: PURGE_PENDING, U-APQ: PURGE_PENDING, L-TIJ: PURGE_PENDING, N-UPC: PURGE_PENDING, U-INS: PURGE_PENDING, W-CSV: PURGE_PENDING, P-Q4: RETAINED, N-TIJ: RETAINED, L-X: RETAINED, X-Q1: RETAINED}
    blobs_absent: [X-Q2P, X-Q4, X-Q5, A-SCR, U-APQ, L-TIJ, N-UPC, U-INS, W-CSV]
    journal: [1]
    purge_records: []
    open_runs: [P1]
    sets_present: [S0]
    refused: {claim insert: names fundamentals retention purge, db backup: names fundamentals retention purge}
  after_rerun:
    states: as purge.states
    journal: [1, 2, 3, 4]
    open_runs: []
    max_open_runs: 1
    sets: as backup.after_rerun
    bodies: no non-EXPIRED capture lacks its body; no EXPIRED capture has a body link
replay:
  meaning: 'identical = replay_run(run) equals load_results(run); {ORIGINAL_EXPIRED: [..]} = replay_run raises OriginalExpiredError naming exactly those captures; in a restore, identical = in neither replay_mismatches nor replay_expired, replay_expired = listed in replay_expired; replay_mismatches is empty in both restores'
  runs:
    RUN-L: {at_A: identical, D1: {ORIGINAL_EXPIRED: [L-TIJ]}, D3: {ORIGINAL_EXPIRED: [L-TIJ]}, restore_pre_purge: replay_expired, restore_licence_end: replay_expired}
    RUN-N: {at_A: identical, stage1_at: {src: STAGE1, path: 'runs[9].replay', lex: equal}, D1: {ORIGINAL_EXPIRED: [N-UPC]}, D3: {ORIGINAL_EXPIRED: [N-TIJ, N-UPC]}, restore_pre_purge: replay_expired, restore_licence_end: replay_expired}
    RUN-Q2: {at_A: identical, D1: identical, D3: identical, restore_pre_purge: identical, restore_licence_end: identical}
    RUN-Q4: {at_A: identical, D1: identical, D3: identical, restore_pre_purge: identical, restore_licence_end: identical}
    RUN-Q5: {at_A: identical, D1: identical, D3: identical, restore_pre_purge: identical, restore_licence_end: identical}
  first_party: RUN-Q2, RUN-Q4 and RUN-Q5 stay identical after their exchange bytes expire (ledger §6 table, row 1)
