# Equity-OS local services. One service today; add new services here as the product needs them.
# Local values (host data path, credentials, port) come from the untracked .env — see .env.example.
name: equity-os

services:
  postgres:
    # Latest stable major, pinned to an exact minor; upgrade deliberately, never via a floating tag.
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EQOS_PG_DB:?set EQOS_PG_DB in .env}
      POSTGRES_USER: ${EQOS_PG_USER:?set EQOS_PG_USER in .env}
      # Read only when initializing an empty data dir; the admin password is not kept in .env
      # (bead eqos-z53), so supply it from the shell for that first `up`.
      POSTGRES_PASSWORD: ${EQOS_PG_PASSWORD:-}
    ports:
      - "127.0.0.1:${EQOS_PG_PORT:?set EQOS_PG_PORT in .env}:5432"
    volumes:
      # Bind mount to a host directory (not a container-managed volume) so it can be backed up
      # directly. The 18 image keeps PGDATA under /var/lib/postgresql/18/docker.
      - type: bind
        source: ${EQOS_PG_DATA_DIR:?set EQOS_PG_DATA_DIR in .env}
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
