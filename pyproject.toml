[project]
name = "fundamentals"
version = "0.0.0"
description = "Source-backed earnings-review product (Phase 0.5 INFY pilot)."
requires-python = ">=3.12"
dependencies = [
    "bse>=3.3.1",
    "edgartools>=5.51.0",
    "lxml>=6.1.2",
    "nse>=3.2.1",
    "nselib>=2.5.1",
    "pydantic>=2.7",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20260815",
]

[project.scripts]
fundamentals = "fundamentals.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundamentals"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]
