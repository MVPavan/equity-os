[project]
name = "equity-os"
version = "0.0.0"
description = "Source-backed earnings-review product (Phase 0.5 INFY pilot)."
requires-python = ">=3.12"
dependencies = [
    "bse>=3.3.1",
    "edgartools>=5.51.0",
    "lxml>=6.1.2",
    "nse>=3.2.1",
    "nselib>=2.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "requests>=2",
    "structlog>=26.1.0",
    "urllib3>=2",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20260815",
]
login = [
    "playwright>=1.64.0",
]

[project.scripts]
eqos = "equity_os.interface.entry.cli:main"
eqos-operator = "equity_os.interface.entry.operator_cli:main"

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["equity_os"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[[tool.mypy.overrides]]
module = "rapidocr_onnxruntime"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
# Every test folder is on the path (generated by the move) so a test module can import the shared
# seam beside it (``screener_financials_support``) instead of duplicating it.
pythonpath = [
    ".",
    "tests/equity_os",
    "tests/equity_os/analysis/calculations",
    "tests/equity_os/analysis/lenses/forward",
    "tests/equity_os/analysis/lenses/thesis_tests",
    "tests/equity_os/analysis/thesis_models",
    "tests/equity_os/companies/identity",
    "tests/equity_os/companies/onboarding",
    "tests/equity_os/contracts/measurement",
    "tests/equity_os/coverage/screens",
    "tests/equity_os/extraction/model",
    "tests/equity_os/extraction/news",
    "tests/equity_os/extraction/packages",
    "tests/equity_os/extraction/results_pdf",
    "tests/equity_os/extraction/surfaces",
    "tests/equity_os/extraction/vendors/screener",
    "tests/equity_os/extraction/vendors/tijori",
    "tests/equity_os/extraction/vendors/upstox",
    "tests/equity_os/extraction/xbrl",
    "tests/equity_os/interface/commands/publication",
    "tests/equity_os/interface/commands/sourcing",
    "tests/equity_os/interface/commands/verification",
    "tests/equity_os/interface/entry",
    "tests/equity_os/interface/workflows",
    "tests/equity_os/normalisation/derivation",
    "tests/equity_os/normalisation/dictionary",
    "tests/equity_os/normalisation/mapping",
    "tests/equity_os/publication/approval",
    "tests/equity_os/publication/checking",
    "tests/equity_os/publication/drafting",
    "tests/equity_os/publication/revision",
    "tests/equity_os/sourcing/documents",
    "tests/equity_os/sourcing/exchange",
    "tests/equity_os/sourcing/news",
    "tests/equity_os/sourcing/surfaces",
    "tests/equity_os/sourcing/transport",
    "tests/equity_os/sourcing/vendors/screener",
    "tests/equity_os/sourcing/vendors/tijori",
    "tests/equity_os/sourcing/vendors/upstox",
    "tests/equity_os/storage/backup",
    "tests/equity_os/storage/database",
    "tests/equity_os/storage/facts",
    "tests/equity_os/storage/memory",
    "tests/equity_os/storage/raw_files",
    "tests/equity_os/storage/records",
    "tests/equity_os/storage/retention",
    "tests/equity_os/support",
    "tests/equity_os/verification/admission",
    "tests/equity_os/verification/comparison",
    "tests/equity_os/verification/diagnostics",
    "tests/equity_os/verification/review_queue",
]
testpaths = ["tests"]
markers = [
    "pg: needs the compose PostgreSQL service up (see .claude/project/verification.md)",
    "retained: reads the gitignored retained Apar originals under data/raw/watchlist/aparinds",
]
