- site: screener-subscriber
  id: company-page
  scope: COMPANY
  path: /company/{symbol}/[consolidated/]
  group: NONE
  cadence: AFTER_RESULTS
- site: screener-subscriber
  id: chart-api
  scope: COMPANY
  path: /api/company/{company_id}/chart/?q={metric-set}&days={n}&consolidated=
  group: SERIES
  cadence: DAILY

# Task 10: G2 company tables and lists (logical sections are not fetched).
- site: screener-subscriber
  id: section-documents
  scope: COMPANY
  path: /company/{symbol}/[consolidated/]#documents
  group: TABLE
  cadence: AFTER_RESULTS
  selector: //*[@id="documents"]
- site: screener-subscriber
  id: company-trades
  scope: COMPANY
  path: /trades/company-{company_id}/
  group: TABLE
  cadence: AFTER_RESULTS
  selector: //div[starts-with(@id,"trades-")]/table
  xhr: true
- site: screener-subscriber
  id: company-announcements
  scope: COMPANY
  path: /announcements/{recent|important|search}/{company_id}/
  group: TABLE
  cadence: AFTER_RESULTS
  selector: //ul[@class="list-links"]
  xhr: true
