# First-party SHP XBRL entries (plan D8 Task 3; d8-probe.md §3-§5, §7, §11.2, §13.3). Every filed
# SEBI category row maps to its v3 member at both filed denominators; the five subcategories that
# §13.5 rules a vendor node onto map at TOTAL_SHARES only (the only pairing denominator, R10). No
# entry for the total, C1 (no member, E8), the diluted percentage (no denominator member), holders,
# pledges, counts or other subcategories. Share class from the validated filing ISIN (R4).
source: nse-shareholding-xbrl
surface: NSE_SHP_XBRL
schema_identity: http://www.bseindia.com/xbrl/shp/2025-10-31/in-bse-shp
defaults:
  tier: EQUIVALENCE_UNPROVEN
  member_source: SECURITY_ISIN
  period_kinds: [INSTANT]
entries:
  - entry_id: shp.sebi_promoter_group.total_shares
    selector: {native_field: ShareholdingAsAPercentageOfTotalNumberOfShares, period_shape: INSTANT, dimension_axis: CategoryOfShareholdersAxis, dimension_member: ShareholdingOfPromoterAndPromoterGroupMember}
    canonical_id: shp_holding_pct
    dimension_members: {shareholding_category: sebi_promoter_group, denominator: TOTAL_SHARES}
    evidence_ref: 'd8-probe.md §4, §7, §11.2: context <Member>_ContextI on CategoryOfShareholdersAxis = in-bse-shp:ShareholdingOfPromoterAndPromoterGroupMember (instant 2026-06-30), filed APARINDS, TITAN; format row R/reference/gen-1/02.bin (sha256 f069059d…) p. 3 "(A) Promoter & Promoter Group", bound by label (taxonomy 404, §11.1). TOTAL_SHARES: element ShareholdingAsAPercentageOfTotalNumberOfShares, the format''s column VIII "Shareholding as a % of total no. of shares (calculated as per SCRR, 1957) As a % of (A+B+C2)" (R/reference/gen-1/02.bin (sha256 f069059d…) p. 3; d8-probe.md §4, §5, §11.2), i.e. the SCRR base A+B+C2, which equals all shares only while C1 is empty (filed WhetherTheListedEntityHasAnySharesAgainstWhichDepositoryReceiptsAreIssued = false, context MainI, all three). Filings gen-2/02.bin sha256 APARINDS 619f5c14…, ETERNAL 739e3788…, TITAN bb74c426….'
  - entry_id: shp.sebi_promoter_group.voting_rights
