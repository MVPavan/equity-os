# First-party SHP XBRL entries for the 2025-05-31 taxonomy (PILOT-9 Amendment A1). Each repeats a
# shareholding_filing/v1/shp.yaml entry whose selector has exactly one fact in APARINDS gen-4, gen-5
# and gen-6; the eight v1 selectors with no such fact get no entry. Ids carry a .2025_05 suffix.
source: nse-shareholding-xbrl
surface: NSE_SHP_XBRL
schema_identity: http://www.bseindia.com/xbrl/shp/2025-05-31/in-bse-shp
defaults:
  tier: EQUIVALENCE_UNPROVEN
  member_source: SECURITY_ISIN
  period_kinds: [INSTANT]
entries:
  - entry_id: shp.sebi_promoter_group.total_shares.2025_05
    selector: {native_field: ShareholdingAsAPercentageOfTotalNumberOfShares, period_shape: INSTANT, dimension_axis: CategoryOfShareholdersAxis, dimension_member: ShareholdingOfPromoterAndPromoterGroupMember}
    canonical_id: shp_holding_pct
    dimension_members: {shareholding_category: sebi_promoter_group, denominator: TOTAL_SHARES}
    evidence_ref: 'Format row R/reference/gen-1/02.bin (sha256 f069059d…) p. 3 "(A) Promoter & Promoter Group", bound by label (taxonomy 404, §11.1). TOTAL_SHARES: element ShareholdingAsAPercentageOfTotalNumberOfShares, the format''s column VIII "Shareholding as a % of total no. of shares (calculated as per SCRR, 1957) As a % of (A+B+C2)" (R/reference/gen-1/02.bin (sha256 f069059d…) p. 3; d8-probe.md §4, §5, §11.2), i.e. the SCRR base A+B+C2, which equals all shares only while C1 is empty (filed WhetherTheListedEntityHasAnySharesAgainstWhichDepositoryReceiptsAreIssued = false, context MainI, all three). PILOT-9 A1: same local name, unit, decimals and context shape filed in APARINDS gen-4/02.bin (sha256 da042398…, instant 2025-09-30, namespace 2025-05-31); SEBI format 2025/35 in force from the quarter ending 2025-06-30; equivalence to the 2025-10-31 entry inferred, not proven from definitions (neither .xsd retained); scope: these observed shapes only.'
