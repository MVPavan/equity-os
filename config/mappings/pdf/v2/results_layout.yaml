# Results-PDF layout entries v2 (eqos-4j2.33): v1 plus the Apar Q3 FY26-Q1 FY27 results layout
# (sha256 2f9c6d5a, 17f5bc04, c0c2b2fa). v1 header follows.
# Results-PDF layout entries (D1a Task 5) for the issuer-configured SEBI LODR results layout, read
# from the PDF text layer through Task 11's statement blocks. Labels are as the text layer prints
# them on the retained Q2 FY26 results PDF (sha256 8be1b8de), garbled variants included; repeated labels are
# told apart by section heading or ordinal within the block. Lines whose meaning no retained capture
# evidences (OCI tax lines, composite 'other financial' lines, 'Others / Unallocable', the two
# unallocable lines, the segment-page repeats of P&L lines) stay unmapped.
# No source: these entries apply to every authorised results PDF of the NSE_RESULTS_PDF surface
# (the issuer config names the source; decision-12 authority admits it).
surface: NSE_RESULTS_PDF
schema_identity: sebi-lodr-results-layout
defaults:
  tier: EQUIVALENCE_UNPROVEN
entries:
