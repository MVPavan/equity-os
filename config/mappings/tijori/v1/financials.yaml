# Tijori financials island (D1b.1). Only the rows Stage 1 compares; every other line is kept
# as an UNMAPPED occurrence. All entries are unproven: the island declares neither unit nor
# displayed precision (spec §2, §5; D4 withdrew the 0.5-crore declaration).
source: tijori
surface: financials
schema_identity: tijori-financials-island-v1
defaults:
  tier: EQUIVALENCE_UNPROVEN
  period_rule: COLUMN_DURATION
entries:
- entry_id: tijori.qt_c.revenue_from_operations
  selector: {statement_family: PL, labels: [Net Sales], section_equals: qt_c}
  canonical_id: revenue_from_operations
  basis: [CONSOLIDATED]
  period_kinds: [QUARTER]
  evidence_ref: 'Retained Tijori qt_c tables (data/raw/snapshots/v1/tijori/financials, 2026-09-05):
    Net Sales is the first quarterly line, before Other Income. Unproven until measured (D3).'
- entry_id: tijori.qt_s.revenue_from_operations
  selector: {statement_family: PL, labels: [Net Sales], section_equals: qt_s}
  canonical_id: revenue_from_operations
  basis: [STANDALONE]
  period_kinds: [QUARTER]
  evidence_ref: 'Retained Tijori qt_s tables; standalone-only issuers (NETWEB) publish only
    *_s tables. Unproven until measured (D3).'
- entry_id: tijori.qt_c.profit_continuing_after_tax
  selector: {statement_family: PL, labels: [Net Profit], section_equals: qt_c}
  canonical_id: profit_continuing_after_tax
  basis: [CONSOLIDATED]
  period_kinds: [QUARTER]
  evidence_ref: 'docs/specs/2026-10-11-canonical-financial-data-and-cross-source-comparison.md
    §2 known traps: Tijori qt_c "Net Profit" is continuing PAT before associates, never
    profit_for_period; unproven until re-measured at displayed precision (D4).'
- entry_id: tijori.pl_c_s.revenue_from_operations
  selector: {statement_family: PL, labels: [Sales], section_equals: pl_c_s}
  canonical_id: revenue_from_operations
  basis: [CONSOLIDATED]
  period_kinds: [YEAR, TTM]
  evidence_ref: 'Retained Tijori pl_c_s tables: annual Sales columns plus the final TTM column
    (footer "TTM Values as of <label>"; spec §3). Unproven until measured (D3).'
