# v3 (D1b.5): v1 copied forward; only tijori.qt_c.profit_continuing_after_tax changes.
# Tijori financials island (D1b.1). Only the rows Stage 1 compares; every other line is kept
# as an UNMAPPED occurrence. Other entries are unproven: the island declares neither unit nor
# precision; only qt_c money rows take them, from the display fact in display.yaml (spec §2, §5).
source: tijori
surface: financials
schema_identity: tijori-financials-island-v1
defaults:
  tier: EQUIVALENCE_UNPROVEN
  period_rule: COLUMN_DURATION
entries:
- entry_id: tijori.qt_c.revenue_from_operations
  selector: {statement_family: PL, labels: [Net Sales], section_equals: qt_c}
  canonical_id: revenue_from_operations
  basis: [CONSOLIDATED]
  period_kinds: [QUARTER]
  evidence_ref: 'Retained Tijori qt_c tables (data/raw/snapshots/v1/tijori/financials, 2026-09-05):
    Net Sales is the first quarterly line, before Other Income. Unproven until measured (D3).'
- entry_id: tijori.qt_s.revenue_from_operations
  selector: {statement_family: PL, labels: [Net Sales], section_equals: qt_s}
  canonical_id: revenue_from_operations
  basis: [STANDALONE]
  period_kinds: [QUARTER]
  evidence_ref: 'Retained Tijori qt_s tables; standalone-only issuers (NETWEB) publish only
    *_s tables. Unproven until measured (D3).'
- entry_id: tijori.qt_c.profit_continuing_after_tax
