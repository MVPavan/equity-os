constructions:
  - rule_id: screener.balance-sheet.liabilities_incl_nci
    source: screener-subscriber
    surface: SCREENER_FINANCIALS
    schema_identity: screener-financials-html-v1
    canonical_id: liabilities_incl_nci
    bases: [CONSOLIDATED]
    operands:
      - name: borrowings
        selector:
          statement_family: BALANCE_SHEET
          labels: [Borrowings]
          section_equals: balance-sheet
      - name: other_liabilities
        selector:
          statement_family: BALANCE_SHEET
          labels: [Other Liabilities]
          section_equals: balance-sheet
    expression:
      op: ADD
      args:
        - {op: OPERAND, operand: borrowings}
        - {op: OPERAND, operand: other_liabilities}
    evidence_ref: >-
      docs/specs/2026-10-11-canonical-financial-data-and-cross-source-comparison.md
      section 2 known trap; independently hand-read retained source oracle prepared before
      implementation: original retained THERMAX and HFCL balance-sheet tables print Borrowings
      and Other Liabilities on the consolidated Rs. Crores surface at Mar 2025. Borrowings plus
      Other Liabilities emits liabilities_incl_nci only; Total Liabilities and first-party NCI
      are excluded. Scope remains equivalence-unproven.
