          sign: 1
          unit_transform: SCALE_TO_BASE_UNIT
          precision_rule: DECLARED
          value_kind: CURRENCY_AMOUNT
          currency: INR
          period_nature: INSTANT
          dimension_members: {}
          bases: [CONSOLIDATED]
          period_kinds: [INSTANT]
          evidence_ref: >-
            Task 15 source oracle: original retained THERMAX and HFCL balance-sheet tables
            print Other Liabilities on the consolidated Rs. Crores surface at Mar 2025.
    expression:
      op: ADD
      args:
        - {op: OPERAND, operand: borrowings}
        - {op: OPERAND, operand: other_liabilities}
    evidence_ref: >-
      docs/specs/2026-10-11-canonical-financial-data-and-cross-source-comparison.md
