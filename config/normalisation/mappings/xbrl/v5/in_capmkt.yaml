# in-capmkt 2026-01-31 entries (PREP-1). The SEBI 2026-01-31 taxonomy keeps the 2025-01-31 element
# names Apar files: every entry repeats an xbrl/v1/in_capmkt.yaml selector under the new namespace,
# kept only where the retained Apar Q4 FY26 (INTEGRATED_FILING_INDAS_1675395, sha256 be8ef651) or
# Q1 FY27 (INTEGRATED_FILING_INDAS_1701114, sha256 f76a131a) instance files the element in the same
# period shape. Ids carry a .2026 suffix (alignment rules anchor on the entry-id family).
# Meaning checked against the results PDFs' consolidated quarter column (p3 unless noted), Q4 FY26 /
# Q1 FY27 crore: revenue 6,602.81 / 6,591.06; total income 6,622.53 / 6,624.71; total expenses
# 6,286.19 / 6,002.37; ProfitBeforeTax = line 9 (before associates) 328.80 / 622.34; profit for the
# period 253.44 / 467.45; basic EPS 63.09 / 116.37; Q4 total assets 13,711.29 (p6); segment
# revenue gross 7,031.74, assets and liabilities post-elimination 13,711.29 / 7,477.40 (p4). Q4
# CurrentTax 80.26 = (a) 88.84 + (c) (8.58), as the dictionary's current_tax row records.
# Not carried over (stored UNMAPPED): ProfitOrLossAttributableToOwnersOfParent and
# ...NonControllingInterests (Q4 files neither; Q1 files owners -138.56 crore = OCI, against the
# PDF's owners 467.45, so the block's meaning is not evidenced); DeferredTaxAssetsNet,
# CurrentTaxAssets, NoncurrentAssetsClassifiedAsHeldForSale,
# RegulatoryDeferralAccountDebitBalancesAndRelatedDeferredTaxAssets, NonControllingInterest and
# OtherNoncurrentLiabilities (filed in neither 2026 instance).
