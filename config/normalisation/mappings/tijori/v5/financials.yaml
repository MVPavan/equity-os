    §2 known traps: Tijori qt_c "Net Profit" is continuing PAT before associates, never
    profit_for_period. v3: re-measured at displayed precision (extractor tijori-v3 compares
    the rendered value of display.yaml) against eight Q3 FY25 in-bse-fin filings. The scope
    schema is the comparison filing taxonomy and its condition is read from that filing,
