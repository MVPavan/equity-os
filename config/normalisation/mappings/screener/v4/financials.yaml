- label: Borrowings
  section: balance-sheet
  reason: operand of construction screener.balance-sheet.liabilities_incl_nci (screener/v2/constructions.yaml);
    no entry of its own
- label: Other Liabilities
  section: balance-sheet
  reason: operand of construction screener.balance-sheet.liabilities_incl_nci (screener/v2/constructions.yaml);
    no entry of its own
- label: Total Liabilities
  section: balance-sheet
  reason: the balance-sheet total of the liabilities side, equal in scope to total assets; deliberately
    has no liability mapping (docs/research/canonical-field-coverage-inventory.md §2b)
- label: Fixed Assets
  section: balance-sheet
  reason: net block across property, right-of-use and intangible assets; composition unestablished
- label: Investments
  section: balance-sheet
  reason: combines current and non-current investments; no single canonical concept
- label: Other Assets
  section: balance-sheet
  reason: residual vendor grouping; not a filed Ind AS line
- label: Free Cash Flow
  section: cash-flow
  reason: vendor-derived measure; not a filed line
- label: Net Cash Flow
  section: cash-flow
  reason: before or after the effect of exchange rates unestablished
- label: 'CFO/EBITDA Share of operating profit converting into cash: CFO (before tax) / Operating Profit'
  section: cash-flow
  reason: percentage the vendor computes from other lines; ratios are computed by code (spec §6.1)
