# Every source the code knows today, by source id. No product code reads this file.
# tests/equity_os/contracts/sourcing/test_source_list.py holds it equal to the code's own registries:
#   catalog        BUILTIN_SOURCES in equity_os/contracts/sourcing/source_catalog.py (class/evidence role)
#   surfaces       VENDOR_SURFACES in the same module (surface: role of a result side)
#   capture_specs  config/sourcing/vendor_surface/surfaces.yaml (raw-first vendor capture specs)
#   routes         ROUTES in equity_os/sourcing/vendors/upstox/upstox_source.py
# A source with no `catalog` key is not in BUILTIN_SOURCES; describing it there raises UnknownSourceError.
#
# role, assigned from those declarations:
#   first-party         issuer or exchange data; catalog class first_party, or exchange identity surfaces
#   vendor cross-check  derived aggregator whose values are compared with first-party values, and, for Screener and Tijori under
#                       VENDOR-1, the primary number source within its pilot scope
#   diagnostic          read or retained, never a vote (catalog diagnostic_only, or SourceRole DIAGNOSTIC)
#   reference           not evidence of a value: news metadata, owner config, internal stores, definitions
# status: active = code acquires or reads it today; planned = named by the owner, no code yet.
#
# config_declared: per-issuer sources declared in config/sourcing/fundamentals.yaml blocks and added to
# the catalog at the composition root; their ids are issuer-specific, so the blocks are listed instead.

