# Screens `fundamentals coverage export --screen <name>` runs (amendment 2026-10-18-screen-export):
# each names an owner-authored formula per vendor, run directly at that vendor (nothing is saved
# there); editing a formula makes a new screen definition. Never commit a person-named screen.
- name: d7-stage4
  screener: Market Capitalization > 20000
  tijori: Market Capitalization > 20000
- name: aparinds-coverage
  screener: Number of equity shares > 39969150 AND Number of equity shares < 40370850
  tijori: Net Block > 1126 AND Net Block < 2092
- name: aparinds-coverage-v2
  screener: Number of equity shares > 3.9969 AND Number of equity shares < 4.0371 AND Face value = 10
  tijori: Net Block > 1126 AND Net Block < 2092
