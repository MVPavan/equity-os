# Multi-stock validation watchlist — non-secret composition-root configuration.
#
# Loaded only at the composition root (src/fundamentals/api/cli.py) by
# load_watchlist_config; no business-logic module reads this file or the
# environment directly. Secrets (e.g. Tijori credentials) are NOT stored here —
# they are injected from the environment at the composition root. Source bytes
# stay in gitignored data/ (A05-DECISION-004 + bd preapproval-goal-multistock-
# validation-2026-08-21); NSE/BSE are owner-authorized private use, Screener and
# Tijori are DERIVED cross-check only (never source-of-record).
#
# Wave 1 = five maximally-different domains (docs/research/watchlist.md). The
# reviewed quarter is pinned to Q3 FY25 (quarter ended 2024-12-31), which is an
# in-bse-fin filing so the shared Ind-AS concept map applies unchanged. The
# in-capmkt "Integrated Filing" taxonomy applies to Mar-2025+ (FY25 Q4 onward)
# filings; when the orchestrator advances the pinned quarter past that boundary,
# set quarter.filing_taxonomy: in-capmkt and revisit the concept map. The runner
# already parses with the superset of both taxonomies.
#
# needs_verification lists any identifier that is a best-known value not yet
# confirmed against a live filing; the runner surfaces these rather than trusting
# them, and fails closed per stock (never fabricates a scrip/slug).

wave: "Wave-1"
raw_dir: "data/raw/watchlist"

