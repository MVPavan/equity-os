# Consolidated vendor-surface catalog, 2026-10-28. Sources: out/{opus,sol,astra}; existing = lane 0 audit ids (S##/T##) + code pointers.
screener:
  company_variation:
    opus-1: 'opus: Banks and NBFCs (HDFCBANK, CREDITACC, KIRANVYPAR): quarters/P&L rows Revenue, Interest, Expenses, Financing Profit, Financing
      Margin %, ... Gross NPA %, Net NPA % (quarters only); balance sheet shows Deposits (bank only) and Borrowing; Ratios table shrinks to ROE
      %. Insurers (HDFCLIFE, ICICIGI) use the generic Sales/OPM template (no insurance-specific rows); insights carry insurer KPIs. SME half-yearly
      (ANONDITA): heading ''Half Yearly Results'', 6 period columns, exchange tag ''NSE - SME'', no quarterly-insights toggle. Standalone-only
      (NETWEB, ICICIGI, LGEINDIA) are served at /company/{symbol}/ with no ''View Standalone'' link and data-urls without consolidated params.
      Credit ratings block absent for ETERNAL and KIRANVYPAR; Concalls block absent for KIRANVYPAR. Product Segments button absent for NETWEB,
      ANONDITA, CREDITACC. Shareholding classes vary: Government present for PSU/large; ''Others'' for HDFCLIFE, ETERNAL, ASIANENE; HDFCBANK Promoters
      only in yearly tab; KIRANVYPAR only Promoters/Public. F&O tag on large F&O names only. LGEINDIA (recent IPO) has 8-10 period columns.'
    sol-2: 'sol: See observed_urls and section entries; common template presence does not prove populated data.'
    sol-3: 'sol: Observed for the named companies or current account; no population-wide inference.'
    astra-4: 'astra: field/control set differs for ANONDITA, ASIANENE, KIRANVYPAR, PPEL'
    astra-5: 'astra: field/control set differs for ANONDITA, APARINDS, ASIANENE, AUROPHARMA, ETERNAL, GODREJPROP, HDFCLIFE, HINDUNILVR, NETWEB,
      NTPC, PPEL, RELIANCE'
    astra-6: 'astra: field/control set differs for ANONDITA, APARINDS, ASIANENE, AUROPHARMA, ETERNAL, GODREJPROP, HDFCLIFE, HINDUNILVR, KIRANVYPAR,
      NETWEB, NTPC, PPEL, RELIANCE'
    astra-7: 'astra: field/control set differs for ANONDITA, APARINDS, ASIANENE, AUROPHARMA, ETERNAL, GODREJPROP, HDFCBANK, HDFCLIFE, HINDUNILVR,
      KIRANVYPAR, NTPC, PPEL, RELIANCE'
    astra-8: 'astra: field/control set differs for ANONDITA, ETERNAL, HDFCBANK, KIRANVYPAR, NETWEB, PPEL'
    sol-9: 'sol: Exact parent names and available rows vary by bank, insurer, NBFC, ordinary company and empty consolidated template.'
