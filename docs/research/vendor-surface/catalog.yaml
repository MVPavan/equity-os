tijori:
  company_variation:
    opus-1: 'opus: Sections dropped when no data: HDFCLIFE/ICICIGI no forensics/brands/suppliers; NETWEB, CREDITACC, ASIANENE, KIRANVYPAR no marketshare/brands/suppliers;
      ANONDITA no marketshare/operationalmetrics/brands/suppliers; LGEINDIA no marketshare/corporateactions/suppliers; ETERNAL no corporateactions/suppliers;
      TCS, NTPC no brands. is_banking true only for HDFCBANK (bank key-ratio set). ANONDITA and KIRANVYPAR filings are Annual Reports only; listed
      concall document links (files.tijorifinance.com .../Conference Call/CC-*.pdf; attachments not opened) appear on every overview except ANONDITA
      and KIRANVYPAR; separate /concall/transcript/ links only for HDFCBANK and ICICIGI. Slug is the legal name (ETERNAL is still zomato-ltd).'
    sol-2: 'sol: See observed_urls and section entries; common template presence does not prove populated data.'
    sol-3: 'sol: Observed for the named companies or current account; no population-wide inference.'
    astra-4: 'astra: field/control set differs for ANONDITA, APARINDS, ASIANENE, AUROPHARMA, ETERNAL, GODREJPROP, HDFCLIFE, HINDUNILVR, NETWEB,
      NTPC, PPEL, RELIANCE'
    sol-5: 'sol: not seen for HDFCLIFE, ICICIGI'
    astra-6: 'astra: field/control set differs for ANONDITA, APARINDS, ASIANENE, AUROPHARMA, ETERNAL, GODREJPROP, HDFCLIFE, HINDUNILVR, KIRANVYPAR,
      NETWEB, NTPC, PPEL, RELIANCE'
    opus-7: 'opus: Bank template (HDFCBANK): Total Income, Interest Expended, PPOP, Provisions. Insurer template (HDFCLIFE, ICICIGI): Operating
      Profit from Premiums, Income From Investments; fr lacks Operational Ratios. NBFCs (CREDITACC, KIRANVYPAR) use the manufacturing template.
      ICICIGI and NETWEB consolidated tables empty; LGEINDIA has consolidated P&L but no consolidated BS/qt/fr. ANONDITA (half-yearly SME) qt_s
      emits 10 quarterly column labels with sparse, zero-padded coverage: only 4 columns carry values and every Jun and Dec column is zero-filled
      (PPEL: 2 of 10).'
    opus-8: 'opus: ANONDITA has only Mar/Sep columns (half-yearly).'
